name: Morning briefing

on:
  # 기사 마감은 07:00 KST 고정(briefings/*.json cutoff_hour). 실행 시각과 무관.
  # 정시 발행의 주 경로: 외부 스케줄러(cron-job.org)가 07:05 KST에 이 이벤트를 한 번 호출하면
  # 모든 브리핑(교육정책 동향 → AI·데이터)을 차례로 만든다.
  # GitHub 예약 실행은 2~8시간씩 밀리므로(edu-news-alert에서 확인) 보조로만 둔다.
  workflow_dispatch:
    inputs:
      briefing:
        description: "all, or one briefing id (briefings/*.json)"
        default: "all"
        required: true
      force:
        description: "rebuild even if today's briefing exists (true/false)"
        default: "false"
        required: false
  schedule:
    # UTC Sun-Thu 22:15 = KST Mon-Fri 07:15 보조 (오늘 것이 없을 때만 만든다)
    - cron: "15 22 * * 0-4"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build briefings
        id: build
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          ONLY: ${{ github.event.inputs.briefing || 'all' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          args="--only $ONLY"
          if [ "$FORCE" = "true" ]; then args="$args --force"; fi
          python scripts/run_all.py $args

      # 한 브리핑이 실패해도 성공한 것은 올린다
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "briefing: $(TZ=Asia/Seoul date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main

      - uses: actions/configure-pages@v5
        if: always()
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: public
      - id: deployment
        if: always()
        uses: actions/deploy-pages@v4
